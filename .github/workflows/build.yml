name: Build and Test

on:
  push:
  pull_request:
    branches: [ main ]

jobs:
  build-test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install web backend dependencies
        run: python -m pip install -r requirements.txt
      - name: Run web backend tests
        run: python -m unittest discover -s tests -p test_backend.py -v
      - name: Build application
        run: gcc -std=c99 -Wall -Wextra -Isrc -o srs_app src/main.c src/auth.c src/ui.c src/actions_stub.c
      - name: Build unit tests
        run: gcc -std=c99 -Wall -Wextra -Isrc -o test_auth tests/test_auth.c src/auth.c
      - name: Run unit tests
        run: ./test_auth
      - name: Build NFR tests
        run: gcc -std=c99 -Wall -Wextra -Isrc -o test_nfr tests/test_nfr.c src/auth.c
      - name: Run NFR tests
        run: ./test_nfr
      - name: Smoke test (login menu then exit)
        run: printf '2\ny\n' | ./srs_app
      - name: Stability test (bad input must not crash)
        run: printf 'abc\n9\n\n2\nn\n2\ny\n' | ./srs_app
